# 1. Performance - Give Starship more time for heavy repos
command_timeout = 2000

# 2. Global Prompt Layout
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$aws\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "blue"
truncate_to_repo = false

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-cyan"

[git_status]
# Performance: Skip checking submodules in deep repos like terraform
ignore_submodules = true
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[aws]
symbol = "aws "
format = '\[[$symbol($profile)(\($region\))(\[$duration\])]($style)\] '
style = "green"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
